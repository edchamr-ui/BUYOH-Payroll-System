name: buyoh-payroll

services:
  db:
    image: postgres:18-alpine
    container_name: buyoh-payroll-db
    env_file:
      - .env.docker
    volumes:
      - payroll_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buyoh-payroll-web
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        flask --app run.py db upgrade &&
        gunicorn
        --bind 0.0.0.0:8000
        --workers 3
        --timeout 120
        --access-logfile -
        --error-logfile -
        run:app
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: buyoh-payroll-nginx
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:80:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  payroll_postgres_data:
    name: buyoh-payroll-postgres-data
